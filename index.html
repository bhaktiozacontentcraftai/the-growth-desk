<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Growth Desk — SEO, Content & Digital Marketing Guides</title>
    <meta name="description" content="Practical, in-depth guides on SEO, content strategy, and website optimization to help creators, bloggers, and founders grow compounding organic search traffic." />
    <meta name="author" content="The Growth Desk Editorial Team" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Canonical link -->
    <link rel="canonical" id="canonical-tag" href="https://thegrowthdesk.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Growth Desk" />
    <meta property="og:title" content="The Growth Desk — SEO, Content & Digital Marketing Guides" />
    <meta property="og:description" content="Practical, in-depth guides on SEO, content strategy, and website optimization to help creators, bloggers, and founders grow compounding organic search traffic." />
    <meta property="og:url" content="https://thegrowthdesk.com/" />
    <meta property="og:image" content="https://thegrowthdesk.com/images/hero-growth-desk.webp" />
    
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Growth Desk — SEO, Content & Digital Marketing Guides" />
    <meta name="twitter:description" content="Practical, in-depth guides on SEO, content strategy, and website optimization to help creators, bloggers, and founders grow compounding organic search traffic." />
    <meta name="twitter:image" content="https://thegrowthdesk.com/images/hero-growth-desk.webp" />

    <!-- Google Fonts for Editorial Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />

    <!-- Schema.org Organization & WebSite JSON-LD -->
    <script type="application/ld+json" id="website-schema">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://thegrowthdesk.com/#website",
          "url": "https://thegrowthdesk.com/",
          "name": "The Growth Desk",
          "description": "Editorial publication on SEO, content strategy, and online growth.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://thegrowthdesk.com/blog/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://thegrowthdesk.com/#organization",
          "name": "The Growth Desk",
          "url": "https://thegrowthdesk.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://thegrowthdesk.com/logo.png"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-stone-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
